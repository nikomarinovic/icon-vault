<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <defs><clipPath id="bgc"><rect width="256" height="256" rx="51.2"/></clipPath></defs>
  <rect width="256" height="256" rx="51.2" fill="#f5f5f5"/>
  
  <g opacity="1" transform="translate(128,128) rotate(0)"><svg x="-115.19999999999999" y="-115.19999999999999" width="230.39999999999998" height="230.39999999999998" viewBox="0 0 100 100">
  <defs xmlns="http://www.w3.org/2000/svg">
    <linearGradient id="hubFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E17A3E"/>
      <stop offset="100%" stop-color="#C2540F"/>
    </linearGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2"/>
    </filter>
    <filter id="softShadowSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>

  <!-- soft blurred shadow under the hub -->
  <ellipse xmlns="http://www.w3.org/2000/svg" cx="50" cy="55.5" rx="13" ry="7" fill="#000000" opacity="0.4" filter="url(#softShadow)"/>

  <!-- faint blurred shadows under each satellite for grounded consistency -->
  <ellipse xmlns="http://www.w3.org/2000/svg" cx="19" cy="27.5" rx="6" ry="2.4" fill="#000000" opacity="0.25" filter="url(#softShadowSmall)"/>
  <ellipse xmlns="http://www.w3.org/2000/svg" cx="83" cy="23.5" rx="4.2" ry="1.8" fill="#000000" opacity="0.25" filter="url(#softShadowSmall)"/>
  <ellipse xmlns="http://www.w3.org/2000/svg" cx="15" cy="81.5" rx="4.6" ry="1.9" fill="#000000" opacity="0.25" filter="url(#softShadowSmall)"/>
  <ellipse xmlns="http://www.w3.org/2000/svg" cx="86" cy="83.5" rx="6.4" ry="2.6" fill="#000000" opacity="0.25" filter="url(#softShadowSmall)"/>

  <!-- connecting lines -->
  <path xmlns="http://www.w3.org/2000/svg" d="M50 50 Q34 36 19 25" fill="none" stroke="#1C7A73" stroke-width="2.2" stroke-linecap="round"/>
  <path xmlns="http://www.w3.org/2000/svg" d="M50 50 Q69 33 83 21" fill="none" stroke="#D9662B" stroke-width="2.2" stroke-linecap="round"/>
  <path xmlns="http://www.w3.org/2000/svg" d="M50 50 Q31 63 15 79" fill="none" stroke="#D9662B" stroke-width="2.2" stroke-linecap="round"/>
  <path xmlns="http://www.w3.org/2000/svg" d="M50 50 Q71 65 86 81" fill="none" stroke="#1C7A73" stroke-width="2.2" stroke-linecap="round"/>
  <path xmlns="http://www.w3.org/2000/svg" d="M50 50 Q58 68 66 88" fill="none" stroke="#1C7A73" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>

  <!-- satellite nodes -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="19" cy="25" r="6.5" fill="#1C7A73"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="83" cy="21" r="4.5" fill="#D9662B"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="15" cy="79" r="5" fill="#D9662B"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="86" cy="81" r="7" fill="#1C7A73"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="66" cy="88" r="3" fill="#1C7A73" opacity="0.55"/>

  <!-- hub node -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="50" cy="50" r="11" fill="url(#hubFill)"/>
  <circle xmlns="http://www.w3.org/2000/svg" cx="50" cy="50" r="4.2" fill="#0A3634"/>

  <!-- signature spark -->
  <circle xmlns="http://www.w3.org/2000/svg" cx="45.5" cy="45.5" r="1.6" fill="#FBEBD9" opacity="0.9"/>
</svg></g>
  
</svg>