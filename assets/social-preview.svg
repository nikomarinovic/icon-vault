<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">IconVault — Icons for every project.</title>
  <desc id="desc">IconVault banner with its geometric logo, tagline, repository address, and subtle grid of icon shapes.</desc>
  <rect width="1280" height="640" fill="#11151e"/>
  <rect x="28" y="28" width="1224" height="584" rx="30" fill="none" stroke="#303848" stroke-width="2"/>


  <g transform="translate(92 198) scale(3.75)">
    <rect x="2" y="2" width="60" height="60" rx="17" fill="#293246" stroke="#414c63" stroke-width=".6"/>
    <g fill="none" stroke="#f7f8fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m32 15 8 12H24z"/><circle cx="22" cy="42" r="7"/><rect x="35" y="35" width="14" height="14" rx="3"/>
    </g>
  </g>

  <text x="430" y="264" fill="#f7f8fb" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="86" font-weight="750" letter-spacing="-3.5">Icon<tspan fill="#a5b4fc">Vault</tspan></text>
  <rect x="434" y="298" width="82" height="5" rx="2.5" fill="#a5b4fc"/>
  <text x="430" y="370" fill="#e4e7ef" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-.5">Icons for every project.</text>
  <text x="432" y="426" fill="#aeb6c8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21">A curated SVG collection for developers,</text>
  <text x="432" y="456" fill="#aeb6c8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21">tools, technologies, and brands.</text>
  <g transform="translate(432 514)">
    <rect width="172" height="42" rx="21" fill="#252d3d" stroke="#3c465b"/>
    <circle cx="21" cy="21" r="4" fill="#a5b4fc"/>
    <text x="37" y="27" fill="#e5e9f2" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="1.15">OPEN SOURCE</text>
  </g>
</svg>
