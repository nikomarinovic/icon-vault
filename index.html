<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eceef4"><meta name="description" content="Pick SVG icons and build a shareable IconVault gallery link."><title>IconVault — Gallery Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#15171e;--ink-2:#454b5e;--ink-3:#626a80;
  --canvas:#eceef4;--paper:#fff;--line:#d8dce8;--line-2:#e6e9f1;
  --cobalt:#2a47f5;--cobalt-ink:#1b32c4;--cobalt-soft:#e3e7ff;
  --night:#171a23;--night-line:#2b3040;
  --display:"Bricolage Grotesque","Avenir Next",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --stage-bg:#fff;--stage-dot:#d9dded;--stage-text:#626a80;
  --tile:#fff;--tile-line:#e1e4ee;--tile-text:#454b5e;
}
body[data-bg=dark]{--stage-bg:#171a23;--stage-dot:#2c3347;--stage-text:#9aa3ba;--tile:#171a23;--tile-line:#2b3040;--tile-text:#c9cfdf}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{width:min(1320px,100% - 48px);margin-inline:auto}

/* header + hero */
.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:700 19px/1 var(--display);letter-spacing:-.02em}
.brand img{width:32px;height:32px}
.ghlink{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;transition:border-color .15s,color .15s}
.ghlink:hover{border-color:var(--cobalt);color:var(--cobalt-ink)}
.hero{padding:16px 0 14px}
h1{margin:0;max-width:16ch;font:700 clamp(36px,5.4vw,60px)/1 var(--display);letter-spacing:-.04em;text-wrap:balance}
.hero p{margin:12px 0 0;max-width:50ch;color:var(--ink-2);font-size:16px}

/* layout */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:28px;align-items:start;padding-bottom:72px}
.library{min-width:0}

/* search + categories */
.lib-head{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:linear-gradient(var(--canvas) 82%,transparent)}
.searchbox{position:relative}
.search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
#search{width:100%;height:52px;padding:0 16px 0 46px;border:1px solid var(--line);border-radius:14px;outline:0;background:var(--paper);font-size:16px;box-shadow:0 1px 2px rgba(20,30,70,.05)}
#search::placeholder{color:var(--ink-3)}
#search:focus{border-color:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-soft)}
.cats{display:flex;flex-wrap:nowrap;gap:8px;margin-top:12px;padding-bottom:4px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#aab3d0 transparent}
.cats button{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink-2);font-size:13px;font-weight:550;white-space:nowrap;transition:border-color .15s,background .15s}
.cats button:hover{border-color:var(--cobalt)}
.cats button[aria-pressed=true]{border-color:var(--cobalt);background:var(--cobalt);color:#fff}
.cats .n{padding:1px 7px;border-radius:99px;background:var(--canvas);color:var(--ink-3);font-size:11px;font-weight:700}
.cats button[aria-pressed=true] .n{background:rgba(255,255,255,.22);color:#fff}

/* selection tray */
.tray{margin:6px 0 22px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.tray-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tray-title{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:650}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 8px;border-radius:99px;background:var(--cobalt-soft);color:var(--cobalt-ink);font-size:12px;font-weight:700}
.clear{padding:4px 8px;border:0;border-radius:6px;background:none;color:var(--cobalt-ink);font-size:13px;font-weight:600}
.clear:hover{background:var(--cobalt-soft)}
.selected{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.empty{color:var(--ink-3);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 11px;border-radius:8px;background:var(--cobalt-soft);color:var(--cobalt-ink);font-size:13px;font-weight:500}
.chip button{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:inherit;font-size:17px;line-height:1}
.chip button:hover{background:#cdd4ff}

/* icon grid */
.grid-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sectitle{margin:0;font:650 22px/1.2 var(--display);letter-spacing:-.02em}
#resultcount{color:var(--ink-3);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.grid[data-view=big]{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.grid[data-view=big] .option{min-height:176px;gap:12px}
.grid[data-view=big] .option img{width:96px;height:96px}
.grid[data-view=more]{grid-template-columns:repeat(auto-fit,minmax(min(100%,76px),1fr));gap:8px}
.grid[data-view=more] .option{min-height:96px;gap:7px;padding:10px 5px 8px}
.grid[data-view=more] .option img{width:36px;height:36px}
.grid-views{margin-left:auto}
.option{position:relative;min-width:0;min-height:112px;display:grid;justify-items:center;align-content:center;gap:10px;padding:14px 6px 10px;border:1px solid var(--tile-line);border-radius:12px;background:var(--tile);transition:border-color .15s,box-shadow .15s}
.option:hover{border-color:var(--cobalt)}
.option[aria-pressed=true]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.option img{width:44px;height:44px;object-fit:contain}
.option>span:last-child{width:100%;overflow:hidden;color:var(--tile-text);font-size:12px;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.check{position:absolute;top:7px;right:7px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--cobalt);color:#fff;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.option[aria-pressed=true] .check{opacity:1;transform:none}
.sentinel{grid-column:1/-1;height:1px}
.noresults{grid-column:1/-1;padding:40px 12px;color:var(--ink-2);text-align:center}

/* studio */
.studio{position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 18px 40px -24px rgba(30,40,100,.35);scrollbar-width:thin}
.grabber{display:none;width:38px;height:4px;margin:2px auto 10px;border-radius:4px;background:var(--line)}
.studio-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.studio-head h2{display:flex;align-items:center;gap:10px;margin:0;font:650 24px/1.1 var(--display);letter-spacing:-.025em}
.sheet-close{display:none}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px}
.stage-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink-2);transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:var(--cobalt);color:var(--cobalt-ink)}
.stage{display:flex;flex-direction:column;justify-content:safe center;min-height:260px;max-height:min(52vh,460px);padding:22px;overflow:auto;border:1px solid var(--line);border-radius:14px;background-color:var(--stage-bg);background-image:radial-gradient(var(--stage-dot) 1px,transparent 1.3px);background-size:16px 16px;scrollbar-width:thin;scrollbar-color:#aab3d0 transparent}
body[data-bg=dark] .stage{border-color:var(--night-line)}
.previewgrid{display:flex;flex-direction:column;gap:var(--gap,16px);width:100%}
.preview-row{display:flex;flex-wrap:nowrap;justify-content:var(--align,flex-start);align-items:center;gap:var(--gap,16px);width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:3px;scrollbar-width:thin;scrollbar-color:#aab3d0 transparent}
.previewcard{display:grid;place-items:center;flex:0 0 var(--size,64px);width:var(--size,64px);height:var(--size,64px)}
.previewcard img{width:var(--size,64px);height:var(--size,64px);object-fit:contain}
.emptypreview{padding:8px;color:var(--stage-text);font-size:14px;text-align:center}
.fitbox{display:flex;flex:none;justify-content:var(--outer,flex-start);width:100%}
.fitinner{flex:none;width:100%}
.fitbox:not(.fit){width:max-content;min-width:100%}
.fitbox:not(.fit) .fitinner{width:max-content;min-width:100%}
.fitbox:not(.fit) .previewgrid{width:max-content;min-width:100%}
.fitbox:not(.fit) .preview-row{overflow:visible;padding-bottom:0}
.fit .fitinner{overflow:hidden}
.fit .previewgrid{width:max-content;transform-origin:0 0}
.fit .preview-row{overflow:visible;padding-bottom:0}
.caption{margin:9px 2px 0;color:var(--ink-3);font:12px/1.5 var(--mono)}

.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2)}
.sec-title{margin:0 0 12px;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.field.wide{grid-column:1/-1}
.lab{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;font-size:13px;font-weight:650}
.lab output{color:var(--ink-3);font:500 12px var(--mono)}
.field-hint{margin:7px 0 0;color:var(--ink-3);font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:11px;background:var(--canvas)}
.seg button{height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--cobalt-ink);box-shadow:0 1px 3px rgba(20,30,70,.18)}
.seg.small button{height:28px;padding:0 12px;font-size:12px}
#columns{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;outline:0;background:var(--paper)}
#columns:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
#spacing{width:100%;accent-color:var(--cobalt)}

.share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}
#share{min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;outline:0;background:var(--canvas);color:var(--ink-2);font:12px var(--mono)}
#share:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;font-size:14px;font-weight:650;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--cobalt);color:#fff}
.btn-primary:hover{background:var(--cobalt-ink)}
.btn-quiet{background:var(--canvas);color:var(--ink)}
.btn-quiet:hover{background:#e0e3ee}
.btn:disabled{cursor:not-allowed;opacity:.55}
.hint{margin:8px 0 0;color:var(--ink-3);font-size:13px}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(15,18,32,.62)}
.lb-card{display:flex;flex-direction:column;width:min(1280px,100%);height:min(88dvh,860px);padding:18px 20px 16px;border-radius:20px;background:var(--paper);box-shadow:0 30px 80px -20px rgba(10,14,40,.6)}
.lb-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.lb-head h2{margin:0 auto 0 0;font:650 22px/1.1 var(--display);letter-spacing:-.02em}
.lb-count{color:var(--ink-2);font-size:13px;font-weight:600}
.lb-tools{display:flex;align-items:center;gap:8px}
.lb-close{height:36px}
.lb-stage{flex:1;min-height:0;max-height:none;padding:28px}

/* mobile dock + sheet */
.dock{display:none}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,18,32,.5)}
footer{padding:0 0 28px;color:var(--ink-3);text-align:center;font-size:13px}
footer a{color:var(--cobalt-ink);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}

@media(max-width:1100px){.shell{grid-template-columns:minmax(0,1fr) 400px}}
@media(max-width:960px){
  .shell{grid-template-columns:1fr;padding-bottom:120px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
  .strip{display:flex;flex:1;align-items:center;gap:6px;min-width:0;height:44px;padding:0 10px;overflow:hidden;border:1px solid var(--tile-line);border-radius:10px;background:var(--tile);color:var(--tile-text);font-size:13px;white-space:nowrap}
  .strip img{flex:0 0 auto;width:26px;height:26px;object-fit:contain}
  .strip span{flex:0 0 auto;font-weight:600}
  .studio{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:50;max-height:88dvh;padding:10px 18px calc(22px + env(safe-area-inset-bottom));border:0;border-radius:22px 22px 0 0;box-shadow:0 -20px 50px -20px rgba(15,20,50,.5);visibility:hidden;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
  .studio.open{visibility:visible;transform:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .grabber{display:block}
  .sheet-close{display:inline-flex;align-items:center;height:36px}
  .stage{min-height:200px}
}
@media(max-width:560px){
  .wrap{width:calc(100% - 28px)}
  .top{height:56px}
  .hero{padding:10px 0 12px}
  .hero p{font-size:15px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .option{min-height:104px}
  .btn{padding:0 14px}
  .settings{grid-template-columns:1fr}
  .lightbox{padding:0}
  .lb-card{width:100%;height:100dvh;border-radius:0;padding:14px 14px 12px}
  .lb-stage{padding:18px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body data-bg="light">
<header class="top wrap"><a class="brand" href="https://github.com/nikomarinovic/icon-vault"><img src="assets/icon-vault.svg" alt=""><span>IconVault</span></a><a class="ghlink" href="https://github.com/nikomarinovic/icon-vault/tree/main/icons">Browse all icons on GitHub</a></header>
<section class="hero wrap"><h1>Build your icon gallery.</h1><p>Pick from <span id="filecount">…</span> open-source SVGs, set the layout, and share one link.</p></section>
<main class="shell wrap">
<section class="library" aria-label="Icon library">
<div class="lib-head">
  <div class="searchbox"><svg class="search-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search by name or category (e.g. database, cloud, python)" autocomplete="off" aria-label="Search icons"></div>
  <div class="cats" id="cats" role="group" aria-label="Filter by category"></div>
</div>
<div class="tray"><div class="tray-head"><h2 class="tray-title">Your selection <span id="selected-count" class="count">0</span></h2><button id="clear" class="clear" type="button" hidden>Clear selection</button></div><div id="selected" class="selected"></div></div>
<div class="grid-head"><h2 class="sectitle" id="grid-title">Icon library</h2><span id="resultcount"></span><div id="grid-views" class="seg small grid-views" role="group" aria-label="Icon library view"><button type="button" data-view="big" aria-pressed="false">Big icons</button><button type="button" data-view="default" aria-pressed="true">Default</button><button type="button" data-view="more" aria-pressed="false">More icons</button></div></div>
<div id="grid" class="grid" data-view="default"></div>
</section>

<aside id="studio" class="studio" aria-labelledby="studio-title">
<div class="grabber" aria-hidden="true"></div>
<div class="studio-head"><h2 id="studio-title">Your gallery <span id="total" class="count">0</span></h2><button id="sheet-close" class="btn btn-quiet sheet-close" type="button">Done</button></div>

<div class="stage-bar">
  <div class="seg small" data-key="view" role="group" aria-label="Preview size"><button type="button" data-value="actual">Actual</button><button type="button" data-value="fit">Fit</button></div>
  <div class="stage-tools"><button type="button" class="iconbtn bg-toggle"></button><button id="expand" type="button" class="iconbtn" title="Open large preview" aria-label="Open large preview"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button></div>
</div>
<div class="stage"><div id="stage-box" class="fitbox"><div id="stage-inner" class="fitinner"><div id="preview" class="previewgrid" aria-live="polite"></div></div></div></div>
<p id="meta" class="caption"></p>

<div class="sec">
  <h3 class="sec-title">Layout</h3>
  <div class="settings">
    <div class="field wide"><span class="lab" id="lab-layout">Gallery layout</span><div class="seg" data-key="layout" role="group" aria-labelledby="lab-layout"><button type="button" data-value="single">One row</button><button type="button" data-value="custom">Custom grid</button></div><p id="layout-description" class="field-hint"></p></div>
    <div class="field wide" id="custom-row-setting" hidden><label class="lab" for="columns">Icons per row</label><input id="columns" type="number" min="1" max="80" step="1" value="5" inputmode="numeric"></div>
    <div class="field wide"><span class="lab" id="lab-size">Icon size</span><div class="seg" data-key="size" role="group" aria-labelledby="lab-size"><button type="button" data-value="32">Small</button><button type="button" data-value="48">Medium</button><button type="button" data-value="64">Large</button></div></div>
    <div class="field wide"><span class="lab" id="lab-align">Align icons</span><div class="seg" data-key="align" role="group" aria-labelledby="lab-align"><button type="button" data-value="left">Left</button><button type="button" data-value="center">Center</button><button type="button" data-value="right">Right</button></div></div>
    <div class="field wide"><label class="lab" for="spacing">Space between icons <output id="spacing-value" for="spacing">16 px</output></label><input id="spacing" type="range" min="0" max="64" step="2" value="16"></div>
  </div>
</div>

<div class="sec">
  <h3 class="sec-title">Share</h3>
  <div class="seg" data-key="out" role="group" aria-label="Output format"><button type="button" data-value="link">Link</button><button type="button" data-value="md">README Markdown</button><button type="button" data-value="html">README HTML</button></div>
  <div class="share"><input id="share" aria-label="Output" readonly><button id="copy" class="btn btn-primary" type="button" disabled>Copy</button></div>
  <p id="hint" class="hint" aria-live="polite"></p>
</div>
</aside>
</main>
<div id="scrim" class="scrim" hidden></div>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden><div class="lb-card"><div class="lb-head"><h2 id="lb-title">Gallery preview</h2><span id="lb-count" class="lb-count"></span><div class="lb-tools"><div class="seg small" data-key="lbview" role="group" aria-label="Preview size"><button type="button" data-value="actual">Actual size</button><button type="button" data-value="fit">Fit all</button></div><button type="button" class="iconbtn bg-toggle"></button><button id="lb-close" type="button" class="btn btn-quiet lb-close">Close</button></div></div><div class="stage lb-stage"><div id="lb-box" class="fitbox"><div id="lb-inner" class="fitinner"><div id="big-preview" class="previewgrid"></div></div></div></div><p id="lb-meta" class="caption"></p></div></div>
<div class="dock"><div id="strip" class="strip" aria-live="polite"></div><button id="customize" class="btn btn-quiet" type="button" aria-expanded="false" aria-controls="studio">Customize</button><button id="copy-dock" class="btn btn-primary" type="button" disabled>Copy link</button></div>
<footer class="wrap">Made for developers. <a href="https://github.com/nikomarinovic/icon-vault">IconVault</a></footer>
<script>
/* icons.json entries contain each icon's path and category. */
const CAT_ORDER=['programming','frameworks','cloud','databases','devtools','ai','os','design','apps','gaming','hardware','companies','finance','brands','food','automotive','sports','other'];
const CAT_LABELS={programming:'Programming',frameworks:'Frameworks',cloud:'Cloud & DevOps',databases:'Databases',devtools:'Dev tools',ai:'AI',os:'Operating systems',design:'Design & media',apps:'Apps & services',gaming:'Gaming',hardware:'Hardware',companies:'Tech companies',finance:'Finance & crypto',brands:'Brands',food:'Food & drink',automotive:'Automotive',sports:'Sports',other:'Other'};
const catLabel=c=>CAT_LABELS[c]||(c.charAt(0).toUpperCase()+c.slice(1).replace(/[-_]+/g,' '));
const catRank=c=>{const i=CAT_ORDER.indexOf(c);return i<0?999:i};

let iconFiles=[];
const aliases={vs:'visualstudio',vscode:'vscode',visualstudio:'visualstudio',xcode:'xcode',node:'nodejs','node.js':'nodejs',ts:'typescript',js:'javascript'};
const assetVersion='__ASSET_VERSION__';
const params=new URLSearchParams(location.search);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const search=$('#search'),grid=$('#grid'),preview=$('#preview'),columns=$('#columns'),spacing=$('#spacing'),studio=$('#studio'),scrim=$('#scrim'),selected=[];
const state={layout:'single',align:'left',size:'64',bg:'light',view:'actual',lbview:'fit',out:'link',cat:'all'};
const out={link:'',md:'',html:''};
const tiles=new Map();
const lightbox=$('#lightbox'),bigPreview=$('#big-preview'),stageBox=$('#stage-box'),stageInner=$('#stage-inner'),lbBox=$('#lb-box'),lbInner=$('#lb-inner');
const ICON_MOON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
let lbReturn=null;
const clampN=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const slug=s=>s.toLocaleLowerCase().replace(/[^a-z0-9]/g,'');
const clean=s=>s.replace(/\.svg$/i,'');
let choices=[],byKey=new Map(),byBaseKey=new Map();
const collator=new Intl.Collator();

function buildChoices(list){
  choices=list.map(entry=>{
    const file=typeof entry==='string'?entry:entry.file;
    const base=file.split('/').pop();
    const name=clean(base);
    const key=slug(name);
    const variant=base.match(/(?:_| )(dark|light)\.svg$/i)?.[1]?.toLowerCase();
    const label=name.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[-_]+/g,' ').trim();
    const baseKey=slug(name.replace(/(?:_| )(dark|light)$/i,''));
    const folder=file.includes('/')?file.split('/')[0]:'';
    const category=(typeof entry==='object'&&entry.category)||folder||'other';
    return{key,baseKey,variant,file,label,category,hay:slug(label)+' '+slug(name)+' '+slug(category)+' '+slug(catLabel(category))};
  }).sort((a,b)=>collator.compare(a.label,b.label)||collator.compare(a.file,b.file));
  byKey=new Map(choices.map(x=>[x.key,x]));
  byBaseKey=new Map();
  for(const item of choices)if(!byBaseKey.has(item.baseKey)||!item.variant)byBaseKey.set(item.baseKey,item);
}
function resolve(name,legacyTheme){
  const key=aliases[name.toLowerCase()]||slug(name);
  const direct=byKey.get(key);
  if(direct&&direct.key!==direct.baseKey)return direct;
  const base=byBaseKey.get(key)||direct;
  if(base&&legacyTheme){
    const variant=choices.find(item=>item.baseKey===base.baseKey&&item.variant===legacyTheme);
    if(variant)return variant;
  }
  return base;
}
function img(item,lazy){const el=document.createElement('img');el.src='icons/'+item.file.split('/').map(encodeURIComponent).join('/')+'?v='+assetVersion;el.alt=item.label;if(lazy)el.loading='lazy';el.decoding='async';el.onerror=()=>{el.style.opacity='.25';el.title='Could not load this SVG'};return el}

function syncControls(){
  for(const seg of $$('.seg'))for(const b of seg.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.value===state[seg.dataset.key]));
  $('#custom-row-setting').hidden=state.layout!=='custom';
  $('#layout-description').textContent=state.layout==='single'?'Keep every selected icon together on one scrollable row.':'Choose how many icons appear before a new row starts.';
  $('#spacing-value').textContent=spacing.value+' px';
  document.body.dataset.bg=state.bg;
  for(const b of $$('.bg-toggle')){const t=state.bg==='light'?'Switch to dark backdrop':'Switch to light backdrop';b.innerHTML=state.bg==='light'?ICON_MOON:ICON_SUN;b.title=t;b.setAttribute('aria-label',t)}
}
function refreshOut(){
  const has=selected.length>0;
  const sh=$('#share');
  sh.value=state.out==='link'?out.link:has?out[state.out]:'';
  sh.placeholder=has?'':'Select icons to generate this';
  $('#copy').disabled=!has;$('#copy-dock').disabled=!has;
  $('#hint').textContent=!has?'Choose icons first to create a link with your selection.':state.out==='link'?'The link saves your selected icons and display settings.':state.out==='md'?'Markdown image that displays the selected icons in a README.':'Centered image HTML for a GitHub README.';
}
function updateUrl(){
  const url=new URL(location.href);const query=[];
  if(selected.length)query.push('icons='+selected.map(x=>x.key).join(','));
  query.push('size='+state.size,'gap='+spacing.value,'align='+state.align);
  if(state.layout==='custom')query.push('row='+columns.value);
  if(state.bg!=='light')query.push('bg='+state.bg);
  url.search=query.join('&');
  history.replaceState(null,'',url);
  const mdUrl=url.origin+'/image'+url.search;
  out.link=url.toString();
  out.md='![My Skills]('+mdUrl+')';
  out.html=`<p align="center">\n  <img src="${mdUrl.replace(/&/g,'&amp;')}" alt="My Skills">\n</p>`;
  refreshOut();
}
function perRowCount(){return state.layout==='single'?Math.max(selected.length,1):clampN(Number(columns.value)||5,1,80)}
function metaText(s,mode){
  if(!selected.length)return 'Pick icons to see the layout here.';
  let t=`${state.layout==='single'?'One row':perRowCount()+' per row'}, ${state.size} px icons, ${spacing.value} px gap, ${state.align} aligned`;
  if(mode==='fit'&&s<0.995)t+=`, shown at ${Math.round(s*100)}%`;
  return t;
}
function layoutInto(target){
  const perRow=perRowCount();
  target.style.setProperty('--size',state.size+'px');
  target.style.setProperty('--gap',spacing.value+'px');
  target.style.setProperty('--align',state.align==='right'?'safe flex-end':state.align==='center'?'safe center':'flex-start');
  target.replaceChildren();
  if(!selected.length){const e=document.createElement('div');e.className='emptypreview';e.textContent='Your gallery appears here as you pick icons.';target.append(e);return}
  for(let i=0;i<selected.length;i+=perRow){
    const row=document.createElement('div');row.className='preview-row';
    for(const item of selected.slice(i,i+perRow)){const card=document.createElement('div');card.className='previewcard';card.append(img(item,false));row.append(card)}
    target.append(row);
  }
}
function applyView(box,inner,grid,mode){
  box.style.setProperty('--outer',state.align==='right'?'flex-end':state.align==='center'?'center':'flex-start');
  inner.style.width='';inner.style.height='';
  if(mode!=='fit'){box.classList.remove('fit');grid.style.transform='';return 1}
  box.classList.add('fit');grid.style.transform='none';
  const avail=box.clientWidth,w=grid.offsetWidth,h=grid.offsetHeight;
  if(avail<=0||w<=0){inner.style.width='';return 1}
  const s=Math.min(1,avail/w);
  inner.style.width=Math.ceil(w*s)+'px';inner.style.height=Math.ceil(h*s)+'px';
  grid.style.transform=s<1?`scale(${s})`:'none';
  return s;
}
function refit(){
  const s=applyView(stageBox,stageInner,preview,state.view);
  $('#meta').textContent=metaText(s,state.view);
  if(!lightbox.hidden){const s2=applyView(lbBox,lbInner,bigPreview,state.lbview);$('#lb-meta').textContent=metaText(s2,state.lbview)}
}
function renderPreview(){
  const n=selected.length;
  $('#total').textContent=n;
  $('#lb-count').textContent=`${n} ${n===1?'icon':'icons'}`;
  layoutInto(preview);
  if(!lightbox.hidden)layoutInto(bigPreview);
  refit();
}
function openLightbox(){lbReturn=document.activeElement;lightbox.hidden=false;document.body.classList.add('lock');renderPreview();$('#lb-close').focus()}
function closeLightbox(){lightbox.hidden=true;if(!studio.classList.contains('open'))document.body.classList.remove('lock');if(lbReturn&&lbReturn.focus)lbReturn.focus()}
function renderStrip(){
  const strip=$('#strip');strip.replaceChildren();
  if(!selected.length){strip.textContent='No icons selected yet';return}
  for(const item of selected.slice(0,6))strip.append(img(item,false));
  const more=document.createElement('span');more.textContent=selected.length>6?`+${selected.length-6}`:`${selected.length} ${selected.length===1?'icon':'icons'}`;strip.append(more);
}
function renderSelected(){
  const list=$('#selected');list.replaceChildren();
  $('#selected-count').textContent=selected.length;$('#clear').hidden=!selected.length;
  if(!selected.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='Nothing yet. Click any icon below to add it.';list.append(empty)}
  else for(const item of selected){
    const chip=document.createElement('span');chip.className='chip';chip.append(document.createTextNode(item.label));
    const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.label);remove.onclick=()=>toggle(item);chip.append(remove);list.append(chip);
  }
  renderPreview();renderStrip();updateUrl();
}
function setTile(b,item){const active=selected.some(x=>x.key===item.key);b.setAttribute('aria-pressed',String(active));b.setAttribute('aria-label',`${active?'Remove':'Add'} ${item.label}`)}

/* category filters (search matches name OR category, so "database" lists the whole databases group) */
function renderCats(q){
  const box=$('#cats');box.replaceChildren();
  const all=[...new Set(choices.map(x=>x.category))].sort((a,b)=>catRank(a)-catRank(b)||collator.compare(a,b));
  if(all.length<2){box.hidden=true;return}
  box.hidden=false;
  const counts=new Map();let total=0;
  for(const x of choices)if(!q||x.hay.includes(q)){counts.set(x.category,(counts.get(x.category)||0)+1);total++}
  const mk=(value,label,n)=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(state.cat===value));
    b.append(document.createTextNode(label));
    const c=document.createElement('span');c.className='n';c.textContent=n;b.append(c);
    b.onclick=()=>{state.cat=value;renderGrid()};
    return b;
  };
  box.append(mk('all','All',total));
  for(const c of all)box.append(mk(c,catLabel(c),counts.get(c)||0));
}

const CHUNK=240;let gridObserver=null;
function makeTile(item){
  const b=document.createElement('button');b.type='button';b.className='option';b.title=item.label+' · '+catLabel(item.category);
  const check=document.createElement('span');check.className='check';check.innerHTML='<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 6.2 2.4 2.4 4.6-5"/></svg>';
  b.append(check,img(item,true));
  const label=document.createElement('span');label.textContent=item.label;b.append(label);
  setTile(b,item);b.onclick=()=>toggle(item);tiles.set(item.key,b);
  return b;
}
function renderGrid(){
  const q=slug(search.value);
  renderCats(q);
  const matches=choices.filter(x=>(state.cat==='all'||x.category===state.cat)&&(!q||x.hay.includes(q)));
  $('#grid-title').textContent=state.cat==='all'?'Icon library':catLabel(state.cat);
  $('#resultcount').textContent=`${matches.length.toLocaleString('en')} ${matches.length===1?'icon':'icons'}`;
  if(gridObserver){gridObserver.disconnect();gridObserver=null}
  grid.replaceChildren();tiles.clear();
  if(!matches.length){const e=document.createElement('div');e.className='noresults';e.textContent=choices.length?'No icons match that search. Try a shorter name or another category.':'Could not load icons.json.';grid.append(e);return}
  let shown=0;
  const sentinel=document.createElement('div');sentinel.className='sentinel';sentinel.setAttribute('aria-hidden','true');
  grid.append(sentinel);
  const more=()=>{
    const frag=document.createDocumentFragment();
    for(const item of matches.slice(shown,shown+CHUNK))frag.append(makeTile(item));
    shown=Math.min(shown+CHUNK,matches.length);
    grid.insertBefore(frag,sentinel);
    if(shown>=matches.length){sentinel.remove();if(gridObserver){gridObserver.disconnect();gridObserver=null}}
  };
  more();
  if(shown<matches.length&&'IntersectionObserver' in window){
    gridObserver=new IntersectionObserver(entries=>{
      if(!entries.some(e=>e.isIntersecting))return;
      more();
      if(gridObserver&&shown<matches.length){gridObserver.unobserve(sentinel);gridObserver.observe(sentinel)}
    },{rootMargin:'900px 0px'});
    gridObserver.observe(sentinel);
  }else while(shown<matches.length)more();
}
function toggle(item){
  const i=selected.findIndex(x=>x.key===item.key);
  if(i<0)selected.push(item);else selected.splice(i,1);
  renderSelected();
  const t=tiles.get(item.key);if(t)setTile(t,item);
}
function setSheet(open){
  studio.classList.toggle('open',open);scrim.hidden=!open;
  $('#customize').setAttribute('aria-expanded',String(open));
  document.body.classList.toggle('lock',open);
  (open?$('#sheet-close'):$('#customize')).focus();
}

/* initial state from URL */
columns.value=String(clampN(Number(params.get('row')||params.get('perrow'))||5,1,80));
state.layout=params.get('layout')==='custom'||params.has('row')||(!params.has('layout')&&params.has('perrow'))?'custom':'single';
state.size=['32','48','64'].includes(params.get('size'))?params.get('size'):'64';
const gapValue=params.has('gap')?Number(params.get('gap')):16;
spacing.value=String(clampN(Number.isFinite(gapValue)?gapValue:16,0,64));
state.align=['left','center','right'].includes(params.get('align'))?params.get('align'):'left';
state.bg=params.get('bg')==='dark'?'dark':'light';

/* events */
let searchTimer;search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(renderGrid,120)};
columns.oninput=()=>{columns.value=String(clampN(Number(columns.value)||1,1,80));renderPreview();updateUrl()};
spacing.oninput=()=>{syncControls();renderPreview();updateUrl()};
for(const seg of $$('.seg'))seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state[seg.dataset.key]=b.dataset.value;syncControls();
  renderPreview();updateUrl();
});
$('#clear').onclick=()=>{selected.splice(0);renderSelected();for(const[k,b]of tiles)setTile(b,byKey.get(k))};
$('#grid-views').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]');if(!b)return;
  grid.dataset.view=b.dataset.view;
  for(const button of $('#grid-views').querySelectorAll('button'))button.setAttribute('aria-pressed',String(button===b));
});
async function copyValue(val,btn,msg){
  if(!val)return;
  try{await navigator.clipboard.writeText(val)}catch{const s=$('#share');s.value=val;s.focus();s.select();document.execCommand('copy')}
  const old=btn.textContent;btn.textContent='Copied';$('#hint').textContent=msg;
  setTimeout(()=>{btn.textContent=old;refreshOut()},1700);
}
$('#copy').onclick=()=>copyValue($('#share').value,$('#copy'),state.out==='link'?'Link copied. Share it anywhere.':'Copied to clipboard.');
$('#copy-dock').onclick=()=>copyValue(out.link,$('#copy-dock'),'Link copied. Share it anywhere.');
$('#customize').onclick=()=>setSheet(true);
$('#sheet-close').onclick=()=>setSheet(false);
scrim.onclick=()=>setSheet(false);
addEventListener('keydown',e=>{
  if(!lightbox.hidden){
    if(e.key==='Escape'){closeLightbox();return}
    if(e.key==='Tab'){
      const f=[...lightbox.querySelectorAll('button')].filter(b=>b.offsetParent!==null);
      if(f.length){const first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    }
    return;
  }
  if(e.key==='Escape'&&studio.classList.contains('open'))setSheet(false);
});
$('#expand').onclick=openLightbox;
$('#lb-close').onclick=closeLightbox;
lightbox.addEventListener('mousedown',e=>{if(e.target===lightbox)closeLightbox()});
for(const b of $$('.bg-toggle'))b.onclick=()=>{state.bg=state.bg==='light'?'dark':'light';syncControls();updateUrl()};
const lastW=new Map();
const ro=new ResizeObserver(entries=>{let need=false;for(const en of entries){const w=Math.round(en.contentRect.width);if(lastW.get(en.target)!==w){lastW.set(en.target,w);need=true}}if(need)refit()});
ro.observe(stageBox);ro.observe(lbBox);
matchMedia('(min-width:961px)').addEventListener('change',e=>{if(e.matches&&studio.classList.contains('open')){studio.classList.remove('open');scrim.hidden=true;document.body.classList.remove('lock');$('#customize').setAttribute('aria-expanded','false')}});

function applyIconList(){
  buildChoices(iconFiles);
  selected.length=0;
  const legacyTheme=['dark','light'].includes(params.get('theme'))?params.get('theme'):null;
  for(const name of(params.get('icons')||'').split(',').filter(Boolean)){const item=resolve(name,legacyTheme);if(item&&!selected.some(x=>x.key===item.key))selected.push(item)}
  $('#filecount').textContent=iconFiles.length.toLocaleString('en');
  renderGrid();renderSelected();
}
async function loadIcons(){
  $('#resultcount').textContent='Loading icons…';
  try{
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch('icons.json',{cache:'no-cache',signal:ctrl.signal});
    clearTimeout(timer);
    if(res.ok){
      const data=await res.json();
      if(Array.isArray(data))iconFiles=data.filter(f=>typeof f==='string'?/\.svg$/i.test(f):f&&typeof f.file==='string'&&/\.svg$/i.test(f.file));
    }
  }catch(err){/* icons.json missing or offline */}
  applyIconList();
}
syncControls();loadIcons();
</script></body></html>
